name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (universal release, Intel + Apple Silicon)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify checks
        run: swift run -c release PDFReaderVerify

      - name: Unit tests
        run: swift test

      - name: Package app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/make-app.sh release

      - name: Build DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/make-dmg.sh .build/app/PDFReader.app "PDFReader-${GITHUB_REF_NAME}-macOS-universal.dmg" PDFReader

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" *.dmg --title "$GITHUB_REF_NAME" --generate-notes
