name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Verify checks
        run: swift run PDFReaderVerify

      - name: Unit tests
        run: swift test

      - name: Build universal binary (Intel + Apple Silicon)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          swift build -c release --arch arm64 --product PDFReader --scratch-path .build/arm64
          swift build -c release --arch x86_64 --product PDFReader --scratch-path .build/x86_64
          mkdir -p .build/universal
          lipo -create .build/arm64/release/PDFReader .build/x86_64/release/PDFReader -output .build/universal/PDFReader
          chmod +x .build/universal/PDFReader
          lipo -info .build/universal/PDFReader

      - name: Package app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: APP_BINARY=.build/universal/PDFReader APP_VERSION="${GITHUB_REF_NAME}" APP_BUILD="${GITHUB_RUN_NUMBER}" ./scripts/make-app.sh release

      - name: Build DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/make-dmg.sh .build/app/PDFReader.app "PDFReader-${GITHUB_REF_NAME}-macOS-universal.dmg" PDFReader

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" *.dmg --title "$GITHUB_REF_NAME" --generate-notes
