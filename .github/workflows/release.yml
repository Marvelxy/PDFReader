name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Verify checks
        run: swift run PDFReaderVerify

      - name: Unit tests
        run: swift test

  release:
    needs: build
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    runs-on: macos-15
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          # A manual tag push releases exactly that tag.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            create_tag=false
            echo "Releasing manual tag $version"
          else
            # A tag already pointing at this commit means this is a
            # re-run: reuse it instead of bumping again.
            existing="$(git for-each-ref --points-at=HEAD --sort=-version:refname \
              --count=1 --format='%(refname:short)' 'refs/tags/v*')"
            if [ -n "$existing" ]; then
              version="$existing"
              create_tag=false
              echo "Reusing $version (already at HEAD)"
            else
              latest="$(git for-each-ref --merged=HEAD --sort=-version:refname \
                --count=1 --format='%(refname:short)' 'refs/tags/v*')"
              if [ -z "$latest" ]; then
                version="v1.0.0"
              else
                core="${latest#v}"
                major="${core%%.*}"
                rest="${core#*.}"
                minor="${rest%%.*}"
                patch="${rest#*.}"
                version="v${major}.${minor}.$((patch + 1))"
              fi
              create_tag=true
              echo "Next version: $version (from ${latest:-none})"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

      - name: Build universal binary (Intel + Apple Silicon)
        run: |
          swift build -c release --arch arm64 --product PDFReader --scratch-path .build/arm64
          swift build -c release --arch x86_64 --product PDFReader --scratch-path .build/x86_64
          mkdir -p .build/universal
          lipo -create .build/arm64/release/PDFReader .build/x86_64/release/PDFReader -output .build/universal/PDFReader
          chmod +x .build/universal/PDFReader
          lipo -info .build/universal/PDFReader

      - name: Package app bundle
        env:
          APP_BINARY: .build/universal/PDFReader
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
          SPARKLE_FRAMEWORK: .build/arm64/release/Sparkle.framework
        run: ./scripts/make-app.sh release

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh .build/app/PDFReader.app "PDFReader-${VERSION}-macOS-universal.dmg" PDFReader

      # Tag only after a successful build so a failed run leaves no
      # orphan release tag behind. Pushing with GITHUB_TOKEN does not
      # re-trigger this workflow.
      - name: Tag release commit
        if: steps.version.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" *.dmg --clobber
          else
            gh release create "$VERSION" *.dmg --title "$VERSION" --generate-notes
          fi
